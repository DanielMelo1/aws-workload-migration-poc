# Accepted findings for this proof of concept.
# Each entry documents a deliberate trade-off, not an oversight.
#
# CKV_AWS_130 - Public subnet with auto-assign public IP
#   Fargate requires outbound connectivity to pull images from ECR.
#   Private subnets would require a NAT Gateway or four VPC Interface
#   Endpoints. Neither changes what this proof of concept demonstrates,
#   while adding components to provision and tear down. Production
#   would place tasks in private subnets behind a NAT Gateway.
#
# CKV2_AWS_11 - VPC Flow Logs disabled
#   Flow Logs support traffic analysis over time. This environment is
#   provisioned, exercised and destroyed within days, leaving no
#   analytical window to justify the ingestion. Production would enable
#   them with a defined retention policy.

skip-check:
  - CKV_AWS_130
  - CKV2_AWS_11
