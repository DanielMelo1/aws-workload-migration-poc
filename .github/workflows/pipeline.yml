name: Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  infrastructure:
    name: Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

      - uses: terraform-linters/setup-tflint@v5

      - name: Lint
        working-directory: infra
        run: |
          tflint --init
          tflint

      - name: Security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          config_file: infra/.checkov.yml
          quiet: true
          soft_fail: false

  container:
    name: Container Security
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t workload-migration-poc:${{ github.sha }} ./app

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: workload-migration-poc:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
